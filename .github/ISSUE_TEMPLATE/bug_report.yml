name: Bug report
description: Something does not work as described
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see, including any message in the menu bar panel or a notification.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: version
    attributes:
      label: Version
      description: The release number or commit you are running.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it go wrong
      options:
        - Generating the images
        - Switching the wallpaper
        - Menu bar panel or settings
        - Install, signing or login item
        - Something else
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: Optional.
