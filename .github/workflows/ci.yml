name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        run: xcodegen generate
      - name: Build and test
        run: xcodebuild -project Macchiato.xcodeproj -scheme Macchiato -destination 'platform=macOS' CODE_SIGN_IDENTITY=- test
