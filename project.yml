name: Macchiato
options:
  bundleIdPrefix: io.damao
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
targets:
  Macchiato:
    type: application
    platform: macOS
    sources:
      - path: App
    info:
      path: Config/Info.plist
      properties:
        CFBundleName: Macchiato
        CFBundleDisplayName: Macchiato
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.graphics-design
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.damao.Macchiato
        PRODUCT_NAME: Macchiato
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MacchiatoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: App/Core/Season.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.damao.MacchiatoTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Macchiato:
    build:
      targets:
        Macchiato: all
        MacchiatoTests: [test]
    test:
      config: Debug
      targets:
        - MacchiatoTests
    run:
      config: Debug
    archive:
      config: Release
